name: CI

on:
  push:
    branches: ["main", "final/live-postgres", "integration/final"]
  pull_request:
    branches: ["main", "final/live-postgres"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ohtms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ohtms
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/ohtms
      SESSION_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret-must-be-at-least-32-characters
      ADMIN_EMAIL: admin@mams.local
      ADMIN_PASSWORD: ChangeMe!2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Database Migrations & Bootstrap
        run: |
          npm run db:migrate
          npm run db:bootstrap

      - name: Run Test Suite
        run: npm test

      - name: Production Build Verification
        run: npm run build
